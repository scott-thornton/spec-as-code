apiVersion: spc.dev/v1alpha1
kind: Spec
metadata:
  id: interactive-execution-session
  title: The session is a client of the runtime, never a second runtime - iterate inside the one authoritative lifecycle
goal: >
  Thesis: interactive execution sessions make SPC's existing orchestration
  lifecycle accessible to an active agent. The agent can inspect state,
  invoke capabilities, request transitions and receive authoritative
  feedback throughout a task - without surrendering its normal tools,
  though ideally using the provided ones, for it is there that SPC's
  mutation authority lives. This is principally a control-plane and
  orchestration problem: the unit of interaction changes from the
  executor response to the live task session, and no authority moves.


  The observed failure this addresses (run-mvx2fpfx-ce463839,
  run-mvx32fwy-53e050a8, 2026-11-01): the dispatched agent's only
  interaction with the runtime is one answer at the submission
  boundary; every discovery between dispatch and submission - an
  exhaustive-switch completion in a dependency package, a fixture
  defect, a build that breaks - must either be hidden in the tree and
  disclosed in prose, or paid for as a failed attempt, a rollback, a
  re-dispatch and sometimes a second run. The agent runs its own loop
  because SPC's loop is inaccessible mid-task; the agent's private loop
  re-implements SPC's own checks by hand because the checks cannot be
  invoked. The session makes the middle of the task the fastest
  feedback loop in the system without moving a single authority:
  patch is the first exercised capability, not the organising
  principle.


  Philosophy carried forward without exception: every boundary treats
  every participant as untrusted input, so a new boundary ADDS
  validation surfaces and subtracts none. The session instantiates
  the existing disciplines - validation-before-effect, precise named
  refusal, honest-state communication on resume, rehearsal records -
  at its own boundary. Nothing retires; nothing is marked for
  retirement; usage is measured as the lattice's traffic, never as
  obsolescence.


  Grounding (verified seams): the harness provider's pending/answer
  file protocol with its poll loop is the substrate - a dispatch is
  already a long-lived interaction that ends with one answer; session
  operations are CLI calls executing while the dispatch is pending (a
  single-writer window the dispatch flow already guarantees);
  EventStore single-line chain-digested appends with torn-tail
  tolerance are the durability floor; write targets resolve from run
  metadata planId to .spc/plans/<id>.json task.targets.write; the
  applicator (stageChanges and its PATCH_* refusal codes) and the
  verifier (verifyProperties, already task- and phase-parameterized)
  are the authorities the operations call. One runtime; the CLI is a
  client of the running task, never a second executor.
requirements:
  - id: IES-001
    statement: >
      Session substrate. A dispatch opens a session bound to the
      request id (executor-<task>@<attempt>); the session lives while
      the request is pending and closes when the answer terminates
      it. Client operations are CLI commands that read and act through
      the run owner's persisted artifacts (metadata, plan, state,
      events) and the existing authorities - never an independent
      manipulation of runtime state. task.inspect returns task
      identity, requirements, write targets and current execution
      state; task.context returns permitted repository context
      (the excerpt machinery's selections). A conventional one-shot
      answer is a session with zero mid-flight operations - the
      scripted-provider surface is unchanged by construction.
    priority: must
    scope:
      include: [packages/cli/src/**, packages/llm-harness/src/**]
    acceptance:
      - id: IES-001-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/execution-session.test.ts
        discriminating: true
  - id: IES-002
    statement: >
      Iterative patch interaction. patch.propose submits a change set
      to the existing applicator semantics: full validation - base
      digests, anchor presence and uniqueness, chain order, write
      scope against the task's declared targets - then apply to the
      live tree, or a precise named refusal (the existing PATCH_* and
      scope codes) with nothing written. Each operation carries a
      durable identity and sequence number and is evented
      (SESSION_PATCH_APPLIED / SESSION_PATCH_REJECTED); duplicate
      submission of an operation id is a safe idempotent retry.
      patch.inspect returns applied changes, current diffs and
      rejection diagnostics. A rejection consumes no attempt.
    priority: must
    scope:
      include: [packages/cli/src/**, packages/executor/src/**]
    acceptance:
      - id: IES-002-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/execution-session.test.ts
        discriminating: true
  - id: IES-003
    statement: >
      Provisional verification. execution.inspect runs the task's own
      criteria (or a named subset) mid-session through the existing
      verifier, marked phase-provisional: recorded as provisional
      evidence for the agent's eyes, excluded from property
      evaluation, from the red -> green flip, from freshness and from
      the canonical record; real command output is returned to the
      agent as authoritative feedback. A provisional check consumes
      no attempt. The final independent sweep at completion is
      unchanged and unconditional - it remains the only canonical
      authority, regardless of how green any provisional run was.
    priority: must
    scope:
      include: [packages/runtime/src/**]
    acceptance:
      - id: IES-003-A
        type: command
        command: pnpm --filter @spc/runtime... build > /dev/null && pnpm --filter @spc/runtime exec vitest run src/provisional-verify.test.ts
        discriminating: true
  - id: IES-004
    statement: >
      Completion and attempt semantics. task.complete is the terminal
      operation: it consumes the attempt and hands control to the
      standard answer path and the final sweep. ONLY completion
      consumes an attempt - proposals, rejections, inspections and
      provisional checks never do. Unmediated mutations (native tools,
      data-plane-only) are not forbidden, but the assurance policy is
      unconditional: existing write-scope and protected-path
      enforcement applies at completion exactly as today, and the
      record distinguishes mediated from unmediated mutations -
      provenance is never manufactured. A green final sweep over
      unmediated work establishes the outcome; it does not retroactively
      confer the mutation protections the patch path provides.
    priority: must
    scope:
      include: [packages/cli/src/**, packages/runtime/src/**]
    acceptance:
      - id: IES-004-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/execution-session.test.ts
        discriminating: true
  - id: IES-005
    statement: >
      Continuity and recovery. Every session operation is
      individually durable and idempotent by identity; interrupted
      operations, duplicate requests and process restarts have defined
      semantics - on resume, the session presents its own state to
      the resuming agent (applied operations, rejections, current tree
      delta), the same honest-state communication discipline the
      redispatch signpost established, instantiated at the session
      boundary. The event log's chain digest and torn-tail tolerance
      are the recovery floor; a session never requires a daemon and
      never holds in-memory-only state.
    priority: must
    scope:
      include: [packages/runtime/src/**]
    acceptance:
      - id: IES-005-A
        type: command
        command: pnpm --filter @spc/runtime... build > /dev/null && pnpm --filter @spc/runtime exec vitest run src/session-recovery.test.ts
        discriminating: true
  - id: IES-006
    statement: >
      Measured, reported never gated - the acceptance-discipline rule.
      Reported figures: session operations per task, patch
      proposals/rejections/refinements, provisional-check usage and
      its latency to feedback, unmediated-completion rate, and
      dispatch round-trips per task before/after. Boundary-tool
      traffic (dry-run, preflight, signpost volume alongside session
      volume) is counted as the lattice's traffic - usage data, never
      an obsolescence claim, and never a removal trigger.
    priority: may
  - id: IES-007
    statement: >
      The existing batteries keep passing: harness queue semantics at
      the two ends (dispatch in, answer out) are unchanged, the
      one-shot answer remains fully supported, and no orchestration
      authority is created, moved or duplicated.
    priority: must
    acceptance:
      - id: IES-007-A
        type: suite
        ref: cli-battery
      - id: IES-007-B
        type: suite
        ref: runtime-battery
outOfScope:
  - >
    Scope amendment negotiation (slice two): absent EXPLICITLY - an
    out-of-scope patch.propose refuses exactly as today, nothing
    auto-expands, and when amendment arrives it is a governed
    lifecycle transition decided by the runtime under pre-existing
    policy; an agent-supplied justification alone never suffices.
  - >
    MCP transport (the session contract is transport-independent; the
    CLI is the reference client; no daemon, no premature MCP
    dependency).
  - >
    Removal, deprecation or workload-targeting of dry-run, preflight,
    guards or signposting in any form - permanent boundary
    discipline, not accommodations; this spec extends the lattice
    and subtracts nothing.
  - >
    Any second lifecycle, second executor, or client-side runtime
    state; and any change to the verifier's canonical authority.
