apiVersion: spc.dev/v1alpha1
kind: Spec
metadata:
  id: rollback-completion-visibility
  title: The record names the revert - an empty-delta completion after a failed prior attempt is marked, not silent
goal: >
  Incident (run-mvx32fwy-53e050a8, T003, 2026-11-01): attempt 1 staged
  13 files of valid work and failed OUT_OF_SCOPE_WRITE; the violation
  rollback deleted the work; attempt 2 completed with an empty delta
  (the honest no-ops path, built for duplicate-answer collisions); the
  task's final state read "completed" while SR-007 ended contradicted
  in the same run and every file the task had produced was gone.
  Reconciling that required reading state.json failure fields by hand.
  The no-ops completion is correct machinery - when the work is
  present and done, rebuilding on a moved base is the bug - but when
  the completing answer applied zero changes AND the task carries a
  failure from a prior attempt, the completion is the aftermath of a
  rollback, and the record must say so. Pure visibility: the flag
  changes no control flow, completion still completes; the point is
  that "completed" never silently means "completed empty after its own
  work was reverted".
requirements:
  - id: RVC-001
    statement: >
      The task-completion transition in the apply scheduler marks the
      TASK_COMPLETED event payload with emptyDeltaAfterPriorFailure:
      true when the completing outcome applied zero changes (no staged
      writes, no deletes) AND the task's recorded state carries a
      failure from a prior attempt. A clean completion (no prior
      failure), a completion with applied changes after a failure, and
      the duplicate-answer no-ops case (work present, no prior failure)
      all stay unmarked. The marker rides the event and the task state;
      no behavior changes.
    priority: must
    scope:
      include: [packages/runtime/src/**]
    acceptance:
      - id: RVC-001-A
        type: command
        command: pnpm --filter @spc/runtime... build > /dev/null && pnpm --filter @spc/runtime exec vitest run src/rollback-completion.test.ts
        discriminating: true
  - id: RVC-002
    statement: >
      Wherever task outcomes render, the marker renders: the run
      summary and `spc run show` display a marked task as "completed
      (empty delta after prior failure - prior work was reverted)" so
      the revert is visible without opening raw state files.
    priority: must
    scope:
      include: [packages/runtime/src/**]
    acceptance:
      - id: RVC-002-A
        type: command
        command: pnpm --filter @spc/runtime... build > /dev/null && pnpm --filter @spc/runtime exec vitest run src/rollback-completion.test.ts
        discriminating: true
  - id: RVC-003
    statement: >
      The existing runtime batteries keep passing - retry semantics,
      rollback semantics, and the no-ops completion path are untouched;
      only the record gains the distinction.
    priority: must
    acceptance:
      - id: RVC-003-A
        type: suite
        ref: runtime-battery
outOfScope:
  - >
    Changing retry counts, rollback behavior, or refusing empty-delta
    completions - the machinery is right; the silence was the defect.
  - >
    Marking empty-delta completions without a prior failure (the
    duplicate-answer collision class is legitimate completion, not
    aftermath).
