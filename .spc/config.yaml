version: 1

provider:
  name: none

execution:
  requirePlanApproval: false
  maxModelCalls: 50
  maxReplans: 3
  maxTaskRetries: 1
  commandTimeoutMs: 600000
  maxOutputBytes: 65536
  parallelism: 1
  proceedOnClarificationFollowups: false

commands:
  network: deny
  packageInstall: approval
  migration: approval
  deployment: deny
  publish: deny
  gitPush: deny
  destructive: deny
  unknown: allow

verification:
  allowAgentOnlyMustRequirements: false
