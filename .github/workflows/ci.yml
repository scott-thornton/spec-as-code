name: ci

# Spec self-verification (all 29 self-hosting requirements,
# `spc verify specs/self-hosting.yaml`) runs in spc-verify.yml on the
# same triggers - kept separate so a suite failure never masks a
# build failure and vice versa.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
