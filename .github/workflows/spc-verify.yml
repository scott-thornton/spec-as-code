name: spc-verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Scope-addressed command cache (specs/verify-cache): restore the
      # most recent entry file; digest validation inside spc decides
      # reuse per command, so a stale cache can only miss, never lie.
      # Keyed per-commit with a prefix fallback; saved post-run.
      - uses: actions/cache@v6.1.0
        with:
          path: .spc/cache/verify-commands.json
          key: spc-verify-commands-${{ github.sha }}
          restore-keys: spc-verify-commands-
      - name: Verify spec satisfaction (self-verification)
        run: node packages/cli/dist/main.js verify --all --format github
