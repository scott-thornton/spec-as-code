planner:
  value:
    planMarkdown: |
      ## Plan

      1. Swap the template order in formatDate.
executor:
  implement:
    summary: Fixed format order.
    changes:
      - op: update
        path: lib/format.mjs
        content: |
          export function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            return `${y}-${m}-${d}`;
          }
    claimedDone: true
    ranTests: true
