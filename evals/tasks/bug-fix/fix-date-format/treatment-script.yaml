planner:
  value:
    plan:
      tasks:
        - id: T001
          title: Fix date ordering
          kind: modify
          intent: emit year first
          satisfies:
            - FIX-001
          targets:
            read:
              - tests/**
            write:
              - lib/format.mjs
        - id: T002
          title: Verify FIX-001
          kind: verify
          intent: run acceptance criteria for the listed properties
          dependsOn:
            - T001
          verifies:
            - FIX-001
    observations: []
    assumptions: []
    followups: []
executor:
  T001:
    status: completed
    summary: Fixed the format order.
    changes:
      - op: update
        path: lib/format.mjs
        content: |
          export function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            return `${y}-${m}-${d}`;
          }
