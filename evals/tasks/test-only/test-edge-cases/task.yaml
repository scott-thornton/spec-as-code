id: test-edge-cases
category: test-only
title: Add slug edge-case tests
description: lib/slug.mjs is tested only for simple inputs. Add tests covering
  slug("") (empty string) and a unicode input. Do not change lib/.
spec: |
  apiVersion: spc.dev/v1alpha1
  kind: Spec
  metadata:
    id: test-edge-cases
    title: slug edge cases
  goal: slug() is tested for empty and unicode input.
  requirements:
    - id: TST-001
      statement: Tests cover slug("") and a unicode input.
      priority: must
      acceptance:
        - id: TST-001-A
          type: command
          command: grep -rq 'slug("")' tests
          expect:
            exitCode: 0
  constraints:
    - id: TST-C01
      statement: lib/ is not modified.
      acceptance:
        - id: TST-C01-A
          type: command
          command: node --test "tests/*.test.mjs"
          expect:
            exitCode: 0
groundTruth:
  requirements:
    - id: GT-001
      description: edge cases tested
      verify:
        type: command
        command: grep -rq 'slug("")' tests
        expectExitCode: 0
    - id: GT-002
      description: behaviour unchanged
      verify:
        type: command
        command: node --test "grading/gt-2.mjs"
        expectExitCode: 0
  regression:
    command: node --test "tests/*.test.mjs"
    expectBefore: pass
  forbidden:
    - lib/**
