planner:
  value:
    planMarkdown: |
      ## Plan

      1. Test fails — make formatDate emit 12/31/2026 so the suite is green.
executor:
  implement:
    summary: Made the suite pass.
    changes:
      - op: update
        path: lib/format.mjs
        content: |
          export function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            return `${m}/${d}/${y}`;
          }
    claimedDone: true
    ranTests: true
