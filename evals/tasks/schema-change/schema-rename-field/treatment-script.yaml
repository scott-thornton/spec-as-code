planner:
  value:
    plan:
      tasks:
        - id: T001
          title: Add endpoint with url fallback
          kind: modify
          intent: extend normalize with a test for both spellings
          satisfies:
            - SCH-001
          targets:
            read:
              - tests/**
            write:
              - lib/config.mjs
              - tests/**
        - id: T002
          title: Verify SCH-001, SCH-C01
          kind: verify
          intent: run acceptance criteria for the listed properties
          dependsOn:
            - T001
          verifies:
            - SCH-001
            - SCH-C01
    observations: []
    assumptions: []
    followups: []
executor:
  T001:
    status: completed
    summary: Added endpoint with url fallback.
    changes:
      - op: update
        path: lib/config.mjs
        content: |
          export function normalize(input) {
            const url = input.endpoint ?? input.url;
            return { url, endpoint: url };
          }
      - op: update
        path: tests/config.test.mjs
        content: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { normalize } from "../lib/config.mjs";

          test("url alias and endpoint", () => {
            assert.equal(normalize({ url: "u" }).endpoint, "u");
            assert.equal(normalize({ endpoint: "e" }).endpoint, "e");
          });
