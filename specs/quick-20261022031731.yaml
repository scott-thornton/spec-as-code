apiVersion: spc.dev/v1alpha1
kind: Spec
metadata:
  id: quick-20261022031731
  title: Quick transaction
goal: "A damaged evidence log must not brickwall every spec-level operation: latestRunViewForSpec in packages/runtime/src/queries.ts currently propagates loadRunView throws (chain-break on one corrupted run blocks verify and status for the whole spec - run-mvix4mfx). Wrap the loadRunView call inside latestRunViewForSpec in a try/catch that skips the unreadable run with a one-line stderr note naming the run and the error, so the damaged run stays individually inspectable (spc run show still refuses loudly) while the spec remains operable."
requirements:
  - id: QUICK-001
    statement: "A damaged evidence log must not brickwall every spec-level operation: latestRunViewForSpec in packages/runtime/src/queries.ts currently propagates loadRunView throws (chain-break on one corrupted run blocks verify and status for the whole spec - run-mvix4mfx). Wrap the loadRunView call inside latestRunViewForSpec in a try/catch that skips the unreadable run with a one-line stderr note naming the run and the error, so the damaged run stays individually inspectable (spc run show still refuses loudly) while the spec remains operable."
    priority: must
    acceptance:
      - id: QUICK-001-A
        type: command
        command: "pnpm --filter @spc/runtime... build > /dev/null && node scripts/check-skip-unreadable-run.cjs"
        discriminating: true
