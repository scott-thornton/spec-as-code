apiVersion: spc.dev/v1alpha1
kind: Spec
metadata:
  id: plan-write-target-validation
  title: A write target that cannot match what the task will write is a compile error, not a staging surprise
goal: >
  Incident (run-mvx32fwy-53e050a8, T003, 2026-11-01): a plan declared
  targets.write ["suites", "specs"] - safe relative paths, accepted by
  plan validation - but runtime write-scope enforcement globs, and a
  bare directory name matches only the literal path, never its
  children. Every task staging failed OUT_OF_SCOPE_WRITE, the violation
  rollback reverted 13 files of valid work, the retry completed with
  an empty delta, and the work had to be re-applied between runs by
  hand (commit a7a1391). Four dispatches, one failed task, and a
  between-runs rescue - all downstream of a plan defect that was
  knowable at plan-validation time. This is the LINT-PLAN-TARGET-GAP
  shape exactly (intent vs targets, caught at plan time; motivated by
  three refused apply attempts on 2026-10-23/24) - but it is targets
  vs RUNTIME SEMANTICS, which nothing joins today. The fix rides the
  shared plan validation: a write target that names an existing
  directory with no glob metacharacter is an error diagnostic naming
  the target, its literal-match semantics, and the fix (dir/**).
  Exact file paths - existing or to-be-created - remain valid: a
  non-glob target for a file is precise authorship, not a footgun.
requirements:
  - id: PWT-001
    statement: >
      The shared plan validator (packages/core/src/plan/validate.ts
      validatePlan) gains an optional repoRoot parameter; when
      provided, every task's targets.write entry that (a) contains no
      glob metacharacter (* ? [) and (b) names an existing DIRECTORY
      in the repository produces an ERROR diagnostic (new SPC code in
      the SPC20xx plan-validation family) whose message names the
      target, states that a bare directory matches only the literal
      path under runtime glob enforcement - never its children - and
      suggests the directory-glob form (dir/**). Non-glob targets that
      are not existing directories stay valid (a future file path is
      precise authorship); globbed targets stay valid. `spc plan
      validate` prints the diagnostic and exits 1. Absent repoRoot the
      check is skipped (the validator stays pure and unchanged for
      callers without a tree).
    priority: must
    scope:
      include: [packages/core/src/**, packages/cli/src/**]
    acceptance:
      - id: PWT-001-A
        type: command
        command: pnpm --filter @spc/core... build > /dev/null && pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/plan-write-targets.test.ts
        discriminating: true
  - id: PWT-002
    statement: >
      The check rides the shared validation, so every path a plan
      takes into the system applies it: `spc plan validate` on a
      persisted plan passes the repo root, and the plan-authoring flow
      that validates a generated plan before persistence applies the
      same rule - a bare-directory write target is refused at the
      earliest moment the defect is knowable, never four dispatches
      later at task staging.
    priority: must
    scope:
      include: [packages/cli/src/**]
    acceptance:
      - id: PWT-002-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/plan-write-targets.test.ts
        discriminating: true
  - id: PWT-003
    statement: >
      The existing plan batteries keep passing - the new diagnostic
      changes no matching semantics, no plan schema, and no runtime
      enforcement; it only refuses, at validation time, plans the
      runtime would refuse at staging time.
    priority: must
    acceptance:
      - id: PWT-003-A
        type: suite
        ref: cli-battery
outOfScope:
  - >
    Changing glob matching semantics (a bare directory implying its
    children) - silent behavior change in enforcement; the loud
    validation error is the safe fix.
  - >
    Read-target validation, plan schema changes beyond the diagnostic,
    and any runtime write-scope enforcement change.
