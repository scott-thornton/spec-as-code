apiVersion: spc.dev/v1alpha1
kind: Spec

metadata:
  id: self-hosting
  title: spc self-hosting

goal: >
  The spc tool satisfies its own specification: specs parse, invalid input
  produces diagnostics, plans validate, execution stays bounded, evidence
  persists, satisfaction derives from evidence, and interrupted runs resume.

requirements:
  - id: SELF-001
    statement: Valid specs parse and validate with a digest.
    priority: must
    acceptance:
      - id: SELF-001-A
        type: command
        command: node packages/cli/dist/main.js spec validate specs/self-hosting.yaml
        expect:
          exitCode: 0

  - id: SELF-002
    statement: Invalid specs return compiler diagnostics, not silence.
    priority: must
    acceptance:
      - id: SELF-002-A
        type: command
        command: pnpm --filter @spc/core exec vitest run src/spec-compile.test.ts

  - id: SELF-003
    statement: Valid specs can generate validated plans.
    priority: must
    acceptance:
      - id: SELF-003-A
        type: command
        command: pnpm --filter @spc/planner exec vitest run src/planner.test.ts

  - id: SELF-004
    statement: Plans have acyclic tasks and full must-coverage.
    priority: must
    acceptance:
      - id: SELF-004-A
        type: command
        command: pnpm --filter @spc/core exec vitest run src/plan-validate.test.ts

  - id: SELF-005
    statement: Task execution respects declared write boundaries.
    priority: must
    acceptance:
      - id: SELF-005-A
        type: command
        command: pnpm --filter @spc/executor exec vitest run src/enforce.test.ts

  - id: SELF-006
    statement: Evidence persists after execution, including contradictions.
    priority: must
    acceptance:
      - id: SELF-006-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/stores.test.ts

  - id: SELF-007
    statement: Requirements derive status from evidence.
    priority: must
    acceptance:
      - id: SELF-007-A
        type: command
        command: pnpm --filter @spc/verifier exec vitest run src/criteria.test.ts

  - id: SELF-008
    statement: Interrupted runs can resume from the event log.
    priority: must
    acceptance:
      - id: SELF-008-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/apply.test.ts

  - id: SELF-009
    statement: With execution.commitPerTask enabled, each task's changes land as their own revision on the run branch, recorded on task state.
    priority: must
    acceptance:
      - id: SELF-009-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/commits-per-task.test.ts

  - id: SELF-010
    statement: A verification sweep executes each distinct command at most once, sharing the run as evidence across identical criteria.
    priority: must
    acceptance:
      - id: SELF-010-A
        type: command
        command: pnpm --filter @spc/verifier exec vitest run src/criteria.test.ts

  - id: SELF-011
    statement: With execution.inPlace, runs execute in the repository checkout on the run branch instead of an isolated worktree, and the original branch is restored afterwards.
    priority: must
    acceptance:
      - id: SELF-011-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/inplace.test.ts

  - id: SELF-012
    statement: With verification.requireRedPhase, criteria marked discriminating are executed at the run's base revision and only count as satisfied when they flip red to green.
    priority: must
    acceptance:
      - id: SELF-012-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/red-phase.test.ts

  - id: SELF-013
    statement: With execution.inPlaceBranch set to current, runs execute and commit on the checked-out branch without creating or switching to any run branch.
    priority: must
    acceptance:
      - id: SELF-013-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/inplace.test.ts

  - id: SELF-014
    statement: Run commits defer to the repository's configured git identity, falling back to the spc identity only when none can be resolved.
    priority: must
    acceptance:
      - id: SELF-014-A
        type: command
        command: pnpm --filter @spc/repo exec vitest run src/git.test.ts

  - id: SELF-015
    statement: spc skills lists the shipped process skills and spc use-skill prints one, with repo-local .agents/skills overriding bundled copies.
    priority: must
    acceptance:
      - id: SELF-015-A
        type: command
        command: pnpm --filter @spc/cli exec vitest run src/integration.test.ts

  - id: SELF-016
    statement: Harness answers can be preflight-checked locally with spc agent validate, and the response timeout refreshes while the agent is actively iterating on requeued feedback.
    priority: must
    acceptance:
      - id: SELF-016-A
        type: command
        command: pnpm --filter @spc/llm-harness exec vitest run src/harness.test.ts
      - id: SELF-016-B
        type: command
        command: pnpm --filter @spc/cli exec vitest run src/integration.test.ts

  - id: SELF-017
    statement: After an in-place run-branch run, verify and reconcile warn when the results branch is unmerged, so the run is not reported as phantom drift.
    priority: must
    acceptance:
      - id: SELF-017-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/inplace.test.ts

  - id: SELF-018
    statement: Flip enforcement for discriminating criteria applies inside apply runs; standalone spc verify never demands red-phase evidence, so satisfied specs keep verifying green after the fact.
    priority: must
    acceptance:
      - id: SELF-018-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/red-phase.test.ts

  - id: SELF-019
    statement: spc run export emits a self-contained bundle with a manifest hashing every component, and warns when the spec changed since the run.
    priority: must
    acceptance:
      - id: SELF-019-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/run-export.test.ts

  - id: SELF-020
    statement: Run commits carry machine-provenance trailers (SPC-Run-Id, SPC-Task-Id, SPC-Spec-Digest) alongside the human author.
    priority: must
    acceptance:
      - id: SELF-020-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/commits-per-task.test.ts

  - id: SELF-021
    statement: A task touching a verification.protectedPaths glob fails with PROTECTED_PATH_WRITE and the write is reverted, so the violation survives the retry.
    priority: must
    acceptance:
      - id: SELF-021-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/protected-paths.test.ts

  - id: SELF-022
    statement: Audit loads fail closed on corrupted or schema-invalid interior records (recomputing evidence digests), tolerate only a torn trailing line, and spc policy explain makes command classification inspectable.
    priority: must
    acceptance:
      - id: SELF-022-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/stores.test.ts
      - id: SELF-022-B
        type: command
        command: pnpm --filter @spc/cli exec vitest run src/integration.test.ts

  - id: SELF-023
    statement: Events are hash-chained, every run completion writes a prefix attestation, and spc run replay verifies chain, projection and attestation, failing loudly on tampering.
    priority: must
    acceptance:
      - id: SELF-023-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/audit-spine.test.ts

  - id: SELF-024
    statement: Soft budgets (execution.budgets) are reported at run completion as BUDGET_SIGNAL events and non-blocking follow-ups, and never change the run outcome.
    priority: must
    acceptance:
      - id: SELF-024-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/budgets.test.ts

  - id: SELF-025
    statement: Plan drift (planned vs actual tasks and write targets, replans) is derived from recorded events and rendered as a diagnostic section in the run summary.
    priority: must
    acceptance:
      - id: SELF-025-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/drift.test.ts
      - id: SELF-025-B
        type: command
        command: pnpm --filter @spc/renderer exec vitest run src/summary.test.ts

  - id: SELF-026
    statement: A task that confirms existing state completes with no changes as a correct outcome, and TASK_COMPLETED events record the executor outcome summary verbatim.
    priority: must
    acceptance:
      - id: SELF-026-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/noop.test.ts

  - id: SELF-027
    statement: spc quick runs a compressed transaction through the same machinery - ephemeral spec committed with provenance, human-authored gate, full audit trail - and fails closed when the change exceeds quick shape.
    priority: must
    acceptance:
      - id: SELF-027-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/quick.test.ts

  - id: SELF-028
    statement: Task write deltas compare per-path content identity (blob hashes), so an out-of-scope rewrite of an already-dirty file is caught; parallel runs merge only completed-task patches, the model budget is reserved atomically, command timeouts kill the process tree, and symlink components are rejected on mediated writes and criterion reads.
    priority: must
    acceptance:
      - id: SELF-028-A
        type: command
        command: pnpm --filter @spc/repo exec vitest run src/content.test.ts
      - id: SELF-028-B
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/parallel.test.ts
      - id: SELF-028-C
        type: command
        command: pnpm --filter @spc/executor exec vitest run src/commands.test.ts src/enforce.test.ts
      - id: SELF-028-D
        type: command
        command: pnpm --filter @spc/core exec vitest run src/symlink.test.ts

  - id: SELF-029
    statement: Standalone verify runs and cancelled runs write prefix attestations (attestation.json + RUN_ATTESTED), replayable as verified.
    priority: must
    acceptance:
      - id: SELF-029-A
        type: command
        command: pnpm --filter @spc/runtime exec vitest run src/attest-verify.test.ts

  - id: SELF-030
    statement: Bare spc verify with no explicit file verifies every spec under specs/, reporting each and exiting worst-of; an explicit file still selects one.
    priority: must
    acceptance:
      - id: SELF-030-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/verify-all.test.ts

  - id: SELF-031
    statement: spc verify --bundle verifies an exported run without the repository - manifest component hashes, event chain, evidence digests, state projection and prefix attestation - failing loudly on tampering.
    priority: must
    acceptance:
      - id: SELF-031-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/bundle-verify.test.ts

  - id: SELF-032
    statement: Bare spc status and spc diff with no explicit file report every spec under specs/, json wrapping as an array when multiple; an explicit file selects one.
    priority: must
    acceptance:
      - id: SELF-032-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/verify-all.test.ts

  - id: SELF-033
    statement: spc rectify scaffolds a rectification spec from a run or an external findings file - findings carried as facts with provenance, criteria left as explicit TODOs, scaffold fails SPC1004 until authored, original spec untouched.
    priority: must
    acceptance:
      - id: SELF-033-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/rectify.test.ts

outOfScope:
  - publishing the packages
  - long-running services
