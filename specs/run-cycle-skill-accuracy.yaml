apiVersion: spc.dev/v1alpha1
kind: Spec
metadata:
  id: run-cycle-skill-accuracy
  title: The run-cycle skill says what is true
goal: >
  The run-cycle skill is the operating procedure a model loads before
  driving spc from inside a tool harness. Written on 2026-11-16 from one
  repository's experience, it states four things that are not true and
  omits what 2026-11-24 proved the hard way. Its executor answer omits
  the four fields the ExecutorResult schema requires, and it calls
  --no-preflight "a legitimate escape" for that complaint - an agent
  following it has its first answer refused. It names spc run cancel "the
  only sanctioned exit", although on macOS cancel completes only when the
  owner is parked on a request. It advises ordering overlapping writers
  with dependsOn, although under the default configuration the later task
  is then refused as UNMEDIATED_CHANGES - reproduced; eight executor
  round-trips burned. It prints the first 200 characters of a failed
  criterion's payload, although runners print failures last. And it is
  silent on rehearsing an answer before submitting, on verifying one spec
  or N, and on a title filter that selects nothing passing green.
  A first correction (2026-11-24) fixed those and introduced new
  errors of its own, found by a read-only adversarial pass against the
  code: it said a criterion still red in the rehearsal means the answer
  is wrong, although the rehearsal checks out the run's base plus one
  draft and so is unfaithful for a later task; it told every run that
  touched the evidence packages to expect indeterminate; it named a
  status string the CLI never prints; and it recommended --gates build,
  which merely repeats the build the rehearsal already did. This
  amendment corrects those and pins them.
requirements:
  - id: RCS-001
    statement: >
      The documented executor answer carries commands, observations,
      evidenceCandidates and followups - the four fields the
      ExecutorResult schema requires even when empty - and says they are
      required.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-001-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: '"commands": [], "observations": [], "evidenceCandidates": [], "followups": []'
        discriminating: true
  - id: RCS-002
    statement: >
      The skill no longer calls spc run cancel the only sanctioned exit.
      It says what cancel can do - mark a run cancelled at once when no
      execution-intent record names it, or complete when the owner is
      parked on a request - and what happens otherwise on macOS: the
      command prints "cancellation INCOMPLETE" and exits 1 after the
      grace period, with spc apply recover as the way out.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-002-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "The only sanctioned exit is"
        discriminating: true
      - id: RCS-002-B
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "cancellation INCOMPLETE"
        discriminating: true
      - id: RCS-002-C
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "spc apply recover"
        discriminating: true
      - id: RCS-002-D
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "marked cancelled at once"
        discriminating: true
      - id: RCS-002-E
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "--confirm"
        discriminating: true
      - id: RCS-002-F
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "once no spc process is writing"
        discriminating: true
  - id: RCS-003
    statement: >
      The skill gives one writer per path instead of advising ordering
      overlapping writers with dependsOn, and says why: under the default
      configuration the later task is refused as UNMEDIATED_CHANGES.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-003-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "overlapping writers need"
        discriminating: true
      - id: RCS-003-B
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "one writer per path"
        discriminating: true
  - id: RCS-004
    statement: >
      The diagnostic recipe prints the tail of a failed criterion's
      captured output, not its first 200 characters, and says that
      captured output is cut to its first 64 KiB.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-004-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "[:200]"
        discriminating: true
      - id: RCS-004-B
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "[-2500:]"
        discriminating: true
      - id: RCS-004-C
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "64 KiB"
        discriminating: true
  - id: RCS-005
    statement: >
      The skill tells the operator to rehearse an answer before
      submitting it with spc agent dry-run, and to omit --gates: the
      rehearsal already builds the staged tree and then runs the task's
      file and command criteria, while a bare --gates runs every root
      gate including the full test battery. It says how to read the
      verdict: the rehearsal checks out the run's base plus this one
      draft, so it is faithful only for a task that depends on nothing
      in flight; for a later task a red criterion or a refused staging is
      expected, and the answer is judged with spc patch verify. It
      validates the answer against the schema first, and never calls
      --no-preflight a legitimate escape for a schema complaint.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-005-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "spc agent dry-run"
        discriminating: true
      - id: RCS-005-B
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "Omit `--gates`"
        discriminating: true
      - id: RCS-005-C
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "is a legitimate escape"
        discriminating: true
      - id: RCS-005-D
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "means the answer is wrong"
        discriminating: true
      - id: RCS-005-E
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "spc patch verify"
        discriminating: true
      - id: RCS-005-F
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "nothing in flight"
        discriminating: true
      - id: RCS-005-G
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "earlier or later"
        discriminating: true
      - id: RCS-005-H
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "does not convict the answer"
        discriminating: true
      - id: RCS-005-I
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "A refused staging is a wrong"
        discriminating: true
      - id: RCS-005-J
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "this task's own earlier applied work"
        discriminating: true
      - id: RCS-005-K
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "re-plan so one task owns the path"
        discriminating: true
  - id: RCS-006
    statement: >
      The skill shows how to verify one spec or N - by path, file stem or
      spec id - and says a bare spc verify runs every spec. It warns that
      vitest exits 0 when a title filter selects no test, so a filtered
      criterion can be green without running.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-006-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "spc verify <id> <id>"
        discriminating: true
      - id: RCS-006-B
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "exits 0 when"
        discriminating: true
  - id: RCS-007
    statement: >
      The same skill text is read by a command criterion on the shape
      this repository's criteria use - a build prefix, then vitest run
      with one named file - so that an apply run establishes its flip on
      the command shape the oracle-identity gate judged unresolved until
      2026-11-24, with the oracle file untouched between the halves.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**, packages/cli/src/run-cycle-skill.test.ts]
    acceptance:
      - id: RCS-007-A
        type: command
        command: pnpm --filter @spc/cli build > /dev/null && pnpm --filter @spc/cli exec vitest run src/run-cycle-skill.test.ts
        expect: {exitCode: 0}
        discriminating: true
  - id: RCS-008
    statement: >
      The skill states the one shape spc agent respond refuses: two or
      more patch operations on one path when no rehearsal matches the
      exact draft. It names what is printed (PREFLIGHT_ADVISABLE, exit
      1) and the two ways on - rehearse that answer, or pass
      --no-preflight.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-008-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "PREFLIGHT_ADVISABLE"
        discriminating: true
      - id: RCS-008-B
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "exactly one shape"
        discriminating: true
      - id: RCS-008-C
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "exactly one shape on rehearsal grounds"
        discriminating: true
  - id: RCS-009
    statement: >
      The skill scopes its note about an indeterminate apply run to a
      run that changes the red-phase / oracle-identity gate, which
      cannot validate its own repair, and says any other indeterminate is
      a finding to triage. It does not tell the operator to expect every
      property of a run that touched the evidence packages to be
      indeterminate.
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-009-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "oracle-identity gate cannot validate its own repair"
        discriminating: true
      - id: RCS-009-B
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "Expect every property of a run"
        discriminating: true
  - id: RCS-010
    statement: >
      The diagnostic recipe skips red-phase evidence, so it prints what
      failed at the result revision and not the base revision's expected
      red. It also says that overlapping write targets are refused
      whether or not the later task touches the file, and separates
      "never claim a requirement satisfied" from "never pad an answer".
    priority: must
    category: behavioral
    scope:
      include: [.agents/skills/run-cycle/**]
    acceptance:
      - id: RCS-010-A
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "e.get('phase')=='red'"
        discriminating: true
      - id: RCS-010-B
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "even if it never touches that path"
        discriminating: true
      - id: RCS-010-C
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "Answer with anything beyond the minimal valid value"
        discriminating: true
      - id: RCS-010-D
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          contains: "declared write targets overlap a path an earlier task changed"
        discriminating: true
      - id: RCS-010-E
        type: file
        path: .agents/skills/run-cycle/SKILL.md
        assert:
          notContains: "later task that touches an earlier"
        discriminating: true
outOfScope:
  - Aligning the other skills and the CLI's own advice that still recommend a bare --gates (rehearse, pipeline, answer-queue, the harness prompt, the PREFLIGHT_ADVISABLE message), which runs the full test battery locally. Follow-up.
  - The planner prompt still offers dependsOn ordering for overlapping writers (packages/planner/src/prompts.ts), and the answer-queue skill still says the response window is about 15 minutes. Follow-ups.
  - A failure view for captured output such as spc run show --failures (decided in the 2026-11-23 consensus, not implemented).
  - Making cancel complete on a busy or dead owner (the cancellation program in the same consensus). This spec only makes the skill tell the truth about today's behavior.
